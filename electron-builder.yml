appId: 'kr.sunlitvalley.society.launcher'
productName: 'Society: Sunlit Valley 4.1.3'
artifactName: 'Society-Sunlit-Valley-4.1.3-setup-${version}.${ext}'

copyright: 'Copyright © 2026 Society: Sunlit Valley server administration'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

win:
  signAndEditExecutable: false
  target:
    - target: 'nsis'
      arch: 'x64'

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

linux:
  target: 'AppImage'
  maintainer: 'Society: Sunlit Valley server administration'
  vendor: 'Society: Sunlit Valley'
  synopsis: 'Society: Sunlit Valley 4.1.3 dedicated Minecraft launcher'
  description: 'Dedicated launcher for the unmodified Society: Sunlit Valley 4.1.3 client pack.'
  category: 'Game'

directories:
  buildResources: 'build'
  output: 'dist'
